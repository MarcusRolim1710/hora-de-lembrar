name: Release automática

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Sanidade (sintaxe + imagens + servidor)
        run: |
          node --check server/server.js
          node --check server/gameLogic.js
          node -e "const G=require('./server/gameLogic.js');const b=G.generateBoard(G.getImages());if(b.length!==20)throw new Error('board inválido');console.log('sanidade OK:',b.length,'cartas')"

      - name: Criar Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            CHANGELOG.md
