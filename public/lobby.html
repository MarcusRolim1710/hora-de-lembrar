<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#8b5cf6">
  <meta name="background-color" content="#0f0f1a">
  <meta name="application-name" content="Hora de Lembrar!">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hora de Lembrar!">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <title>Hora de Lembrar! — Lobby</title>
</head>
<body>
  <div class="container">
    <div class="lobby-card">
      <div class="brand-mini">
        <img src="/icons/icon.svg" alt="Hora de Lembrar!" width="44" height="44">
        <span>Hora de Lembrar!</span>
      </div>
      <div class="header">
        <button id="backBtn" class="btn-icon">←</button>
        <h2>Olá, <span id="playerNameDisplay"></span>! 👋</h2>
      </div>

      <div class="mode-selector">
        <h3>Modo de jogo</h3>
        <div class="mode-options">
          <label class="mode-option">
            <input type="radio" name="mode" value="single" checked>
            <div class="mode-content">
              <span class="mode-icon">⚡</span>
              <strong>Rodada Única</strong>
              <p>Quem terminar primeiro vence</p>
            </div>
          </label>

          <label class="mode-option">
            <input type="radio" name="mode" value="best-of-3">
            <div class="mode-content">
              <span class="mode-icon">🏆</span>
              <strong>Melhor de 3</strong>
              <p>Vence quem ganhar 2 rodadas</p>
            </div>
          </label>
        </div>
      </div>

      <div class="actions">
        <button id="createBtn" class="btn btn-primary">
          <span>🎮</span> Criar Sala
        </button>

        <label class="lock-toggle">
          <input type="checkbox" id="lockCheck">
          <span class="lock-slider">🔓</span>
          <span class="lock-text">Proteger com senha (PIN 4 dígitos)</span>
        </label>
        <div id="pinCreateWrap" class="pin-create hidden">
          <input
            type="password"
            id="createPin"
            placeholder="PIN: 4 dígitos"
            maxlength="4"
            inputmode="numeric"
            autocomplete="off"
          >
        </div>

        <div class="divider">ou</div>

        <div class="join-section">
          <h3>Entrar em uma sala</h3>
          <div class="join-input">
            <input
              type="text"
              id="roomCode"
              placeholder="Código da sala"
              maxlength="4"
              autocomplete="off"
            >
            <button id="joinBtn" class="btn btn-secondary">Entrar</button>
          </div>
        </div>

        <!-- Modal PIN para salas com cadeado -->
        <div id="pinModal" class="modal hidden">
          <div class="modal-content">
            <h2>🔒 Sala protegida</h2>
            <p class="pin-room">Sala <strong id="pinRoomId">----</strong> — digite o PIN de 4 dígitos</p>
            <input
              type="password"
              id="joinPin"
              placeholder="••••"
              maxlength="4"
              inputmode="numeric"
              autocomplete="off"
            >
            <div id="pinError" class="error-msg hidden"></div>
            <div class="pin-actions">
              <button id="pinCancelBtn" class="btn btn-ghost">Cancelar</button>
              <button id="pinConfirmBtn" class="btn btn-primary">Entrar</button>
            </div>
          </div>
        </div>

        <div class="available-rooms">
          <h3>Salas disponíveis</h3>
          <div id="roomsList" class="rooms-list">
            <p class="empty-msg">Nenhuma sala disponível</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/lobby.js"></script>
</body>
</html>
