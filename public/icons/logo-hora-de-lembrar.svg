  <!-- wordmark -->
  <g font-family="'Baloo 2','Fredoka','Arial Rounded MT Bold',Arial,sans-serif" text-anchor="start">
    <text x="272" y="140" font-size="72" font-weight="900" letter-spacing="2" fill="url(#word)" stroke="#1e1b4b" stroke-width="2">HORA DE</text>
    <text x="270" y="232" font-size="86" font-weight="900" letter-spacing="2" fill="url(#tbg)" stroke="#ffffff" stroke-width="6" paint-order="stroke">LEMBRAR!</text>
    <g font-size="30" font-weight="800" fill="#fbcfe8">
      <text x="274" y="282">⏰ quem termina primeiro, vence! 🧠</text>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#fde047">
    <path d="M820 40 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6 Z"/>
    <path d="M296 52 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 Z"/>
