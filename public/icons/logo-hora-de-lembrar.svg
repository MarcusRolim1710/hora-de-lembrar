<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340">
  <defs>
    <linearGradient id="tbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="55%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="word" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
  </defs>

  <!-- mascote mini -->
  <g transform="translate(150 170) scale(0.62)">
    <g transform="translate(-150 -40)">
      <g transform="translate(150 170)">
        <circle r="118" fill="#1e1b4b"/>
        <circle r="104" fill="#fff7ed" stroke="#ffffff" stroke-width="6"/>
        <g fill="#8b5cf6">
          <rect x="-8" y="-96" width="16" height="26" rx="8"/>
          <rect x="-8" y="70" width="16" height="26" rx="8"/>
        </g>
        <g stroke-linecap="round">
          <line x1="0" y1="0" x2="-34" y2="-44" stroke="#8b5cf6" stroke-width="14"/>
          <line x1="0" y1="0" x2="44" y2="-10" stroke="#ec4899" stroke-width="14"/>
          <circle r="12" fill="#0f0f1a"/>
        </g>
        <circle cx="-38" cy="22" r="11" fill="#1e1b4b"/>
        <circle cx="38" cy="22" r="11" fill="#1e1b4b"/>
        <circle cx="-35" cy="19" r="4" fill="#fff"/>
        <circle cx="41" cy="19" r="4" fill="#fff"/>
        <path d="M -22 48 Q 0 66 22 48" fill="none" stroke="#1e1b4b" stroke-width="8" stroke-linecap="round"/>
        <ellipse cx="-38" cy="40" rx="14" ry="10" fill="#ec4899" opacity="0.55"/>
        <ellipse cx="38" cy="40" rx="14" ry="10" fill="#ec4899" opacity="0.55"/>
      </g>
      <g fill="#fde047" stroke="#92400e" stroke-width="7">
        <circle cx="64" cy="98" r="24"/>
        <circle cx="236" cy="98" r="24"/>
      </g>
      <g transform="rotate(-14 60 250)">
        <rect x="0" y="200" width="110" height="120" rx="20" fill="#22d3ee" stroke="#fff" stroke-width="8"/>
        <text x="55" y="285" font-family="Arial, sans-serif" font-size="62" font-weight="900" text-anchor="middle" fill="#fff">?</text>
      </g>
      <g transform="rotate(14 250 250)">
        <rect x="190" y="200" width="110" height="120" rx="20" fill="#fb923c" stroke="#fff" stroke-width="8"/>
        <path d="M245 252 c18 0 28 12 28 24 0 16 -14 28 -28 36 -14 -8 -28 -20 -28 -36 0 -12 10 -24 28 -24z" fill="#ef4444" stroke="#fff" stroke-width="5"/>
      </g>
