<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#8b5cf6">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <title>Hora de Lembrar! — Jogando</title>
</head>
<body>
  <div class="container game-container">
    <header class="game-header">
      <div class="brand-mini brand-mini-center game-brand">
        <img src="/icons/icon.svg" alt="Hora de Lembrar!" width="36" height="36">
        <span>Hora de Lembrar!</span>
      </div>
      <div class="game-info">
        <div class="info-item">
          <span class="label">Rodada</span>
          <span class="value" id="roundDisplay">1/1</span>
        </div>
        <div class="info-item">
          <span class="label">Pares</span>
          <span class="value" id="pairsDisplay">0/10</span>
        </div>
        <div class="info-item">
          <span class="label">Tempo</span>
          <span class="value" id="timerDisplay">00:00</span>
        </div>
      </div>
    </header>

    <div id="board" class="board">
      <!-- Cartas geradas via JS -->
    </div>

    <div class="scoreboard">
      <h3>Placar</h3>
      <ul id="scoreList" class="score-list">
        <!-- Preenchido dinamicamente -->
      </ul>
    </div>

    <!-- Modal de vitória da rodada -->
    <div id="roundModal" class="modal hidden">
      <div class="modal-content">
        <h2 id="roundWinnerText"></h2>
        <p id="roundScoreText"></p>
        <div class="loader">⏳ Próxima rodada...</div>
      </div>
    </div>

    <!-- Modal de fim de jogo -->
    <div id="gameOverModal" class="modal hidden">
      <div class="modal-content">
        <div class="trophy">🏆</div>
        <h2 id="gameWinnerText"></h2>
        <div id="finalScore" class="final-score"></div>
        <button id="backToLobbyBtn" class="btn btn-primary">Voltar ao Lobby</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/animations.js"></script>
  <script src="/js/game.js"></script>
</body>
</html>
